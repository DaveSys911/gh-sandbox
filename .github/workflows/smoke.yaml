name: smoke
# workflow_dispatch only: needs write access, so forks and drive-by PRs can never reach the
# self-hosted runner (a privileged dind pod on a laptop kind cluster).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Scale set name (runs-on label)
        default: cibox-daveops
      jobs:
        description: Parallel jobs per runner (load test)
        default: "1"
      hold:
        description: Seconds each job sleeps, so load-test jobs overlap
        default: "0"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        env:
          JOBS: ${{ inputs.jobs }}
        run: echo "shards=[$(seq -s, 1 "$JOBS")]" >> "$GITHUB_OUTPUT"

  smoke:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
        runner: ["${{ inputs.runner }}", ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: runner
        run: |
          echo "runner=$RUNNER_NAME os=$(. /etc/os-release; echo "$PRETTY_NAME") cpus=$(nproc)"
          cat /etc/resolv.conf
          getent hosts github.com
      - name: docker (dind)
        run: |
          docker version --format '{{.Server.Version}}'
          printf 'FROM busybox\nRUN echo built\n' | docker build -q -t cibox-smoke -
          docker run --rm cibox-smoke echo ran
      # curl, not gh: the ARC runner image ships without gh. The anonymous call is the
      # one that differs per runner: it is metered by egress IP, the token call by installation.
      - name: rate limit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core() { sed -n '/"core"/,/}/p' | grep -oE '"(limit|used)": *[0-9]+' | tr -d '" ' | paste -sd' ' -; }
          echo "token: $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit | core)"
          echo "anon:  $(curl -fsS https://api.github.com/rate_limit | core)"
      - name: hold
        if: inputs.hold != '0'
        env:
          HOLD: ${{ inputs.hold }}
        run: |
          [[ "$HOLD" =~ ^[0-9]+$ ]] || { echo "hold must be an integer" >&2; exit 1; }
          sleep "$HOLD"
